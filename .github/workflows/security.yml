name: Security
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze Python
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:python

  dependencies:
    name: Dependency audit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.10'
      # Audit the complete locked dependency set, including optional adapters/dev tools.
      # --disable-pip examines pinned metadata without installing repository dependencies.
      - name: Export locked dependencies
        run: uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file '${{ runner.temp }}/requirements-audit.txt' --quiet
      - name: Audit known vulnerabilities
        run: >-
          uv tool run --python '${{ matrix.python }}' --from pip-audit==2.10.1
          pip-audit --requirement '${{ runner.temp }}/requirements-audit.txt'
          --require-hashes --disable-pip --strict --progress-spinner off
          --format json --output '${{ runner.temp }}/dependency-audit.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-${{ matrix.python }}
          path: ${{ runner.temp }}/dependency-audit.json
          retention-days: 14

  gate:
    name: Security gate
    if: always()
    needs: [codeql, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require security analysis and dependency audit
        env:
          CODEQL: ${{ needs.codeql.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
        run: |
          test "$CODEQL" = success
          test "$DEPENDENCIES" = success
