name: Verify
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LITELLM_LOCAL_MODEL_COST_MAP: 'True'
  AGENTO_OFFLINE: '1'
  UV_NO_PROGRESS: '1'
jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - python: '3.10'
            mcp: 'mcp==1.26.0'
          - python: '3.11'
            mcp: 'mcp>=1.26,<2'
          - python: '3.12'
            mcp: 'mcp>=2,<3'
          - python: '3.13'
            mcp: 'mcp>=2,<3'
          - python: '3.14'
            mcp: 'mcp>=2,<3'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.10'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra all --extra dev --python '${{ matrix.python }}'
      # Deliberate compatibility overrides; quality and PostgreSQL use the exact lock.
      - name: Exercise the supported MCP generation
        run: uv pip install --python .venv/bin/python '${{ matrix.mcp }}'
      - run: uv pip check --python .venv/bin/python
      - run: uv run --no-sync python -m pytest --cov=agento --cov-report=xml --cov-report=term
      - run: uv run --no-sync python scripts/check_examples.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          retention-days: 14
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.10'
          enable-cache: true
      - run: uv sync --locked --extra all --extra dev --python 3.14
      - run: uv run --no-sync python -m ruff check src tests scripts examples
      - run: uv run --no-sync python -m mypy src/agento
      - run: uv run --no-sync python scripts/check_docs.py
      - name: Reproduce synthetic context measurements
        run: uv run --no-sync python scripts/measure_context.py --output '${{ runner.temp }}/context-measurements.json'
      - run: uv build --no-sources
      - run: uv run --no-sync python scripts/check_dist.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-and-context-measurements
          path: |
            dist/*
            ${{ runner.temp }}/context-measurements.json
          if-no-files-found: error
          retention-days: 14
  minimal:
    name: Minimal core (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.10'
          enable-cache: true
      - run: uv sync --locked --python '${{ matrix.python }}'
      - if: matrix.python == '3.10'
        run: uv pip install --python .venv/bin/python 'pydantic==2.7.0'
      - run: uv run --no-sync python tests/run_tests.py
      - run: uv run --no-sync python scripts/check_examples.py
      - run: uv run --no-sync python -c "import agento, sys; assert not any(p in sys.modules for p in ['mcp', 'openai', 'litellm', 'sqlalchemy'])"
  postgres:
    name: PostgreSQL durability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agento
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: agento_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      AGENTO_TEST_POSTGRES_URL: postgresql+asyncpg://agento:local-ci-only@127.0.0.1:5432/agento_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.10'
          enable-cache: true
      - run: uv sync --locked --extra all --extra dev --extra postgres --python 3.14
      - run: uv run --no-sync python -m pytest tests/test_durability.py -q
  gate:
    name: CI gate
    if: always()
    needs: [tests, quality, minimal, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to pass
        env:
          TESTS: ${{ needs.tests.result }}
          QUALITY: ${{ needs.quality.result }}
          MINIMAL: ${{ needs.minimal.result }}
          POSTGRES: ${{ needs.postgres.result }}
        run: |
          test "$TESTS" = success
          test "$QUALITY" = success
          test "$MINIMAL" = success
          test "$POSTGRES" = success
