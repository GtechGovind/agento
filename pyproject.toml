[project]
name = "agento"
version = "0.1.0"
description = "An embeddable agent harness for Python — the runtime layer that turns an LLM into a working agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["agents", "llm", "mcp", "asyncio", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    # Pydantic is the ONLY hard dependency of agento's core.
    #
    # Everything else — model providers, MCP transports, SQL, tokenizers — lives
    # behind a Protocol in an adapter module that is imported lazily, so a host
    # application installs exactly the extras it uses and nothing more.
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/GtechGovind/agento"
Documentation = "https://github.com/GtechGovind/agento/blob/main/docs/README.md"
Repository = "https://github.com/GtechGovind/agento"
Issues = "https://github.com/GtechGovind/agento/issues"
Changelog = "https://github.com/GtechGovind/agento/blob/main/CHANGELOG.md"
Releases = "https://github.com/GtechGovind/agento/releases"

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Model providers
# ---------------------------------------------------------------------------
# LiteLLM is the recommended adapter: one call shape for OpenAI, Anthropic,
# Gemini, Bedrock, Vertex, Azure, Ollama, vLLM, OpenRouter and ~100 more, with
# tool calls, reasoning content, cache tokens and cost already normalized.
litellm = ["litellm>=1.55; python_version >= '3.11'"]
# Direct OpenAI SDK adapter, for hosts that only talk to one OpenAI-compatible
# endpoint and would rather not pull in LiteLLM.
openai = ["openai>=1.60"]

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------
# Official Model Context Protocol SDK — remote MCP servers over
# streamable-http and SSE.
mcp = ["mcp>=1.26,<3"]

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
# One SQLAlchemy 2.0 async implementation serves SQLite, Postgres and MySQL.
sqlite = ["sqlalchemy[asyncio]>=2.0.52", "aiosqlite>=0.20"]
postgres = ["sqlalchemy[asyncio]>=2.0.52", "asyncpg>=0.29"]

# ---------------------------------------------------------------------------
# Niceties — each has an stdlib fallback, so none of these are required
# ---------------------------------------------------------------------------
# tiktoken  : real token counts instead of a characters/4 estimate
# python-ulid: monotonic event ids (agento ships a stdlib fallback)
# pyyaml    : SKILL.md frontmatter (agento ships a minimal fallback parser)
# tenacity  : retry/backoff around provider and MCP calls
extras = [
    "tiktoken>=0.7",
    "python-ulid>=3.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.0",
]
# OpenTelemetry tracing adapter. Tracing is a no-op unless you wire this in.
otel = ["opentelemetry-api>=1.27", "opentelemetry-instrumentation-openai>=0.62.3"]

all = [
    "openai>=1.60",
    "litellm>=1.55; python_version >= '3.11'",
    "mcp>=1.26,<3",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.20",
    "tiktoken>=0.7",
    "python-ulid>=3.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-instrumentation-openai>=0.62.3",
]

dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "types-PyYAML>=6",
    "uvicorn>=0.30",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agento"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false

# Explicit source-distribution contents: never ship local IDE state or audit data.
[tool.hatch.build.targets.sdist]
include = [
    "/src/agento", "/tests", "/examples", "/scripts", "/docs",
    "/README.md", "/LICENSE", "/NOTICE", "/CONTRIBUTING.md", "/SECURITY.md",
    "/CHANGELOG.md", "/pyproject.toml", "/uv.lock", "/AGENTS.md", "/.github",
]

[tool.coverage.run]
branch = true
source = ["agento"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 85
