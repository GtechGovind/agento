<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none" role="img" aria-labelledby="title desc">
<title id="title">The agento framework: context, execution, collaboration, and continuity</title><desc id="desc">A host application drives a typed execution loop. Context capabilities manage tools, skills, artifacts, and history. Model adapters connect to OpenAI, LiteLLM, or custom clients. Tools and child agents perform work. Approval and UI events return control to people, while session stores save snapshots and events. Usage and tracing expose execution metrics.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1280" y2="700" gradientUnits="userSpaceOnUse"><stop stop-color="#101F35"/><stop offset="1" stop-color="#080F1C"/></linearGradient></defs>
